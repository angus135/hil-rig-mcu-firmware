name: firmware-build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Builds exactly like CubeIDE headless build (Eclipse CDT managedbuilder)
      - name: Build (STM32CubeIDE ${{ matrix.configuration }})
        uses: xanderhendriks/action-build-stm32cubeide@v10.0
        with:
          project-path: 'f446ze_cubeide_project'
          project-target: 'f446ze_cubeide_project/${{ matrix.configuration }}'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.configuration }}
          path: |
            f446ze_cubeide_project/${{ matrix.configuration }}/**/*.elf
            f446ze_cubeide_project/${{ matrix.configuration }}/**/*.hex
            f446ze_cubeide_project/${{ matrix.configuration }}/**/*.bin
